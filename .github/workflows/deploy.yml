name: Build And Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: jasperx777/jx-online-testing-platform-backend
  FRONTEND_IMAGE_NAME: jasperx777/jx-online-testing-platform-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application images
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max_attempts=3

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi

              echo "Attempt ${attempt} failed. Retrying in $((attempt * 15)) seconds..."
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          retry docker build \
            --file backend/Dockerfile \
            --tag "${BACKEND_IMAGE}:latest" \
            --tag "${BACKEND_IMAGE}:sha-${GITHUB_SHA}" \
            .
          retry docker push "${BACKEND_IMAGE}:latest"
          retry docker push "${BACKEND_IMAGE}:sha-${GITHUB_SHA}"

          retry docker build \
            --file frontend/Dockerfile \
            --tag "${FRONTEND_IMAGE}:latest" \
            --tag "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}" \
            .
          retry docker push "${FRONTEND_IMAGE}:latest"
          retry docker push "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}"

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: |
            compose.prod.yaml
            docker/nginx/default.conf
            docs/deployment.md
            .env.example

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check deployment secrets
        id: deploy-config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy because secrets are missing
        if: ${{ steps.deploy-config.outputs.configured != 'true' }}
        run: echo "Deployment secrets are not configured; skipping remote deploy steps."

      - name: Copy deployment files to server
        if: ${{ steps.deploy-config.outputs.configured == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "compose.prod.yaml,docker/nginx/default.conf"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Log in to GHCR on server
        if: ${{ steps.deploy-config.outputs.configured == 'true' }}
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            if [ -n "$GHCR_USER" ] && [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            else
              echo "GHCR credentials are not configured; skipping registry login."
            fi

      - name: Deploy updated stack
        if: ${{ steps.deploy-config.outputs.configured == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:sha-${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:sha-${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            export BACKEND_IMAGE="$BACKEND_IMAGE"
            export FRONTEND_IMAGE="$FRONTEND_IMAGE"
            docker compose -f compose.prod.yaml pull backend frontend
            docker compose -f compose.prod.yaml up -d
            docker compose -f compose.prod.yaml restart nginx
