name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Run Django tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        working-directory: backend
        run: |
          coverage run manage.py test --settings=config.settings.test
          coverage report

      - name: Run production configuration check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-placeholder-secret-key-1234567890-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_SESSION_COOKIE_SECURE: 'true'
          DJANGO_CSRF_COOKIE_SECURE: 'true'
          DJANGO_SECURE_HSTS_SECONDS: '3600'
          POSTGRES_DB: testing_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: python backend/manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Audit Node dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: frontend

      - name: Run frontend component tests
        run: npm run test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      - name: Run frontend end-to-end tests
        run: npm run test:e2e
        working-directory: frontend

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: |
          python -m playwright install chromium
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start real backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python backend/manage.py migrate --noinput --settings=config.settings.test
          python backend/manage.py runserver 127.0.0.1:8000 --noreload --settings=config.settings.test > /tmp/jx-backend.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:8000/api/health/ && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/api/health/

      - name: Run real-stack browser workflow
        run: npm run test:e2e:full-stack
        working-directory: frontend
