name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        working-directory: backend
        run: |
          coverage run manage.py test --settings=config.settings.test
          coverage report

      - name: Run production configuration check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-placeholder-secret-key-1234567890-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_SESSION_COOKIE_SECURE: 'true'
          DJANGO_CSRF_COOKIE_SECURE: 'true'
          DJANGO_SECURE_HSTS_SECONDS: '3600'
          POSTGRES_DB: testing_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: python backend/manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
